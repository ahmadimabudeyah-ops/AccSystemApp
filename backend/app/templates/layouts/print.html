<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}طباعة{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Tajawal", sans-serif; direction: rtl; color: #1C1917; }
    h1,h2 { font-family: "Cairo", sans-serif; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #999; padding: 8px; text-align: start; }
    .num { font-variant-numeric: tabular-nums; text-align: end; }
    @media print { .no-print { display: none; } }
  </style>
</head>
<body>
  <div class="no-print" style="margin-bottom:16px"><button onclick="window.print()">طباعة</button></div>
  {% block content %}{% endblock %}
</body>
</html>
