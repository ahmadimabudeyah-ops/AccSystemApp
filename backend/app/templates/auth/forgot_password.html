{% extends "layouts/auth.html" %}
{% block title %}نسيت كلمة المرور{% endblock %}
{% block auth_subtitle %}أدخل بريدك لاستلام رابط الاستعادة{% endblock %}
{% block auth_form %}
<form method="post" action="{{ url_for('web_auth.forgot_password_post') }}">
  <div class="mb-3">
    <label class="form-label" for="email">البريد الإلكتروني <span class="req">*</span></label>
    <input class="form-control" id="email" name="email" type="email" dir="ltr" required>
  </div>
  <button class="btn btn-primary w-100" type="submit">إرسال الرابط</button>
  <div class="text-center mt-3"><a href="{{ url_for('web_auth.login') }}">عودة للدخول</a></div>
</form>
{% endblock %}
