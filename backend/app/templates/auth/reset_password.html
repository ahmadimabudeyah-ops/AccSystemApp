{% extends "layouts/auth.html" %}
{% block title %}إعادة تعيين كلمة المرور{% endblock %}
{% block auth_subtitle %}اختر كلمة مرور جديدة{% endblock %}
{% block auth_form %}
<form method="post" action="{{ url_for('web_auth.reset_password_post', token=token) }}">
  <div class="mb-3">
    <label class="form-label" for="password">كلمة المرور الجديدة <span class="req">*</span></label>
    <input class="form-control" id="password" name="password" type="password" dir="ltr" required minlength="8">
  </div>
  <button class="btn btn-primary w-100" type="submit">حفظ</button>
</form>
{% endblock %}
