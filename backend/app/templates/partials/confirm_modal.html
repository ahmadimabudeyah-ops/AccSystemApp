<div class="modal-overlay" id="confirm-modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-header"><h3 id="confirm-title">تأكيد</h3></div>
    <div class="modal-body"><p id="confirm-text">هل أنت متأكد من تنفيذ هذا الإجراء؟</p></div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="confirm-yes">تأكيد</button>
      <button class="btn btn-secondary" onclick="document.getElementById('confirm-modal').hidden=true">إلغاء</button>
    </div>
  </div>
</div>
<script>
function askConfirm(text, onYes) {
  document.getElementById('confirm-text').textContent = text || 'هل أنت متأكد؟';
  document.getElementById('confirm-modal').hidden = false;
  document.getElementById('confirm-yes').onclick = function () {
    document.getElementById('confirm-modal').hidden = true;
    onYes();
  };
}
</script>
