{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="mb-3">
      {% for category, message in messages %}
        <div class="toast toast-{{ 'error' if category == 'error' else category }}" role="alert">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
