<form class="d-flex gap-2" method="get" action="{{ action or '' }}" role="search">
  <input class="form-control" type="search" name="q" value="{{ q or '' }}" placeholder="بحث…" aria-label="بحث"
    {% if hx_target %}hx-get="{{ action or '' }}" hx-trigger="keyup changed delay:300ms" hx-target="{{ hx_target }}"{% endif %}>
  <button class="btn btn-secondary" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
</form>
