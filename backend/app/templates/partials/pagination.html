{% if page and page.pages and page.pages > 1 %}
<nav aria-label="ترقيم الصفحات" class="mt-3">
  <ul class="pagination">
    {% for p in range(1, page.pages + 1) %}
      <li class="page-item {% if p == page.page %}active{% endif %}">
        <a class="page-link" href="{{ page.base_url }}?page={{ p }}">{{ p }}</a>
      </li>
    {% endfor %}
  </ul>
</nav>
{% endif %}
