{% extends "layouts/dashboard.html" %}
{% block title %}فاتورة مبيعات جديدة{% endblock %}
{% block content %}
<h1 class="mb-3">فاتورة مبيعات جديدة</h1>
<div class="card">
  <form id="invoice-form" data-kind="sales">
    <div class="row g-2 mb-2">
      <div class="col-md-3"><label class="form-label">العميل *</label>
        <select class="form-control" name="customer_id" data-source="customers" required><option value="">اختر…</option></select></div>
      <div class="col-md-3"><label class="form-label">التاريخ *</label>
        <input class="form-control" type="date" name="invoice_date" required></div>
      <div class="col-md-2"><label class="form-label">شروط الدفع (يوم)</label>
        <input class="form-control num ltr" type="number" name="payment_term_days" value="30"></div>
      <div class="col-md-2"><label class="form-label">العملة</label>
        <select class="form-control ltr" name="currency_id" dir="ltr"><option value="JOD">JOD</option><option value="USD">USD</option><option value="EUR">EUR</option><option value="SAR">SAR</option><option value="AED">AED</option></select></div>
      <div class="col-md-2"><label class="form-label">سعر الصرف</label>
        <input class="form-control num ltr" name="exchange_rate" type="number" step="0.0001" value="1" dir="ltr"></div>
    </div>
    <div class="table-wrap mb-2"><table class="table-lux" id="inv-lines">
      <thead><tr><th>الصنف</th><th class="num">الكمية</th><th class="num">السعر</th><th class="num">الخصم %</th><th class="num">الضريبة</th><th></th></tr></thead>
      <tbody><tr>
        <td><select class="form-control" name="product"></select></td>
        <td><input class="form-control num ltr" name="qty" type="number" step="0.001" value="1"></td>
        <td><input class="form-control num ltr" name="price" type="number" step="0.001" value="0"></td>
        <td><input class="form-control num ltr" name="disc" type="number" step="0.01" value="0"></td>
        <td><select class="form-control" name="tax"><option value="">بلا</option></select></td>
        <td><button type="button" class="btn btn-ghost btn-icon" onclick="this.closest('tr').remove();invTotal()">✕</button></td>
      </tr></tbody>
    </table></div>
    <div class="d-flex gap-2 align-center">
      <button type="button" class="btn btn-secondary" onclick="addInvLine()">+ بند</button>
      <strong class="ms-auto">الإجمالي: <span class="num" id="inv-total">0.000</span></strong>
      <button class="btn btn-gold" type="submit">حفظ الفاتورة</button>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/forms.js') }}"></script>
{% endblock %}
