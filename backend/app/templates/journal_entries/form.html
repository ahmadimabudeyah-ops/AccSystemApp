{% extends "layouts/dashboard.html" %}
{% block title %}قيد جديد{% endblock %}
{% block content %}
<h1 class="mb-3">قيد يومية جديد</h1>
<div class="card">
  <form id="entry-form">
    <div class="row g-2 mb-2">
      <div class="col-md-4"><label class="form-label">الدفتر <span class="req">*</span></label>
        <select class="form-control" name="journal_id" required><option value="">اختر…</option></select></div>
      <div class="col-md-4"><label class="form-label">تاريخ الترحيل <span class="req">*</span></label>
        <input class="form-control" type="date" name="posting_date" required></div>
      <div class="col-md-4"><label class="form-label">البيان</label>
        <input class="form-control" name="description" placeholder="شرح القيد…"></div>
    </div>
    <div class="table-wrap mb-2"><table class="table-lux" id="entry-lines">
      <thead><tr><th>الحساب</th><th class="num">مدين</th><th class="num">دائن</th><th></th></tr></thead>
      <tbody><tr><td><select class="form-control" name="account"></select></td>
        <td><input class="form-control num ltr" name="debit" type="number" step="0.001" value="0"></td>
        <td><input class="form-control num ltr" name="credit" type="number" step="0.001" value="0"></td>
        <td><button type="button" class="btn btn-ghost btn-icon" onclick="removeLine(this)" aria-label="حذف سطر">✕</button></td></tr></tbody>
    </table></div>
    <div class="d-flex gap-2 align-center">
      <button type="button" class="btn btn-secondary" onclick="addLine()">+ سطر</button>
      <strong class="ms-auto">الفرق: <span class="num" id="entry-diff">0.000</span></strong>
      <button class="btn btn-gold" type="submit">حفظ مسودة</button>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/forms.js') }}"></script>{% endblock %}
