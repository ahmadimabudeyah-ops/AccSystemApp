# Alembic configuration for AccSystem.
#
# The blessed schema path is the explicit SQL in ../db/sql/ (phase*.sql plus the
# 0014-0016 fixes).  This file only makes `flask db upgrade` / autogenerate work
# as a convenience; env.py loads DATABASE_URL from backend/.env itself.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally absent: app/config.py reads DATABASE_URL from
# backend/.env and migrations/env.py injects it, so there is a single source of
# truth.  Set FLASK_ENV=production to make env.py refuse a weak secret.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.exec = ruff format --quiet REVISION_SCRIPT_FILENAME
ruff_format.skip_if_no_change = True

[loggers]
keys = root,sqlalchemy,alembic,flask

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask]
level = WARNING
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
