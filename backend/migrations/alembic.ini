# Alembic configuration for AccSystem (see backend/alembic.ini for the notes).
#
# The blessed schema path is the explicit SQL in ../db/sql/.  This copy lives
# next to env.py because Flask-Migrate looks for <script_location>/alembic.ini
# first; env.py injects sqlalchemy.url from backend/.env.

[alembic]
script_location = .
prepend_sys_path = ..
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic,flask

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask]
level = WARNING
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
